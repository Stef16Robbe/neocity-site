<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Stef's website</title>
  <meta name="description" content="website">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="style.css">
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
</head>

<body>
  <!--[if lt IE 7]>
            <p class="browsehappy">You are using an <strong>outdated</strong> browser. Please <a href="https://www.mozilla.org/en-US/firefox/new/">upgrade your browser</a> to improve your experience.</p>
        <![endif]-->

  <div class="header">
    <h1>Hai :)</h1>
    <img src="assets/donut.gif" alt="Cool GIF">
  </div>

  <div class="main">
    <div class="rows">
      <img src="assets/handr.gif" alt="hand right" class="handright">
      <p>yoooo</p>
      <img src="assets/handl.gif" alt="hand right" class="handright">
    </div>

    <br />
    <h2>Here are some images I found online that I like</h2>
    <br />
    <div class="carousel">
      <button class="prev" onclick="prevImage()">&#10094;</button>
      <div id="image-container"></div>
      <button class="next" onclick="nextImage()">&#10095;</button>
    </div>
  </div>

  <script>
    const imageCount = 25;
    const images = Array.from({ length: imageCount }, (_, i) => `assets/carousel/${i + 1}.png`);

    let index = 0;
    const imageContainer = document.getElementById("image-container");

    // Dynamically create image elements
    images.forEach((src, i) => {
      const img = document.createElement("img");
      img.src = src;
      if (i === 0) img.classList.add("active"); // First image is visible
      imageContainer.appendChild(img);
    });

    const imgElements = document.querySelectorAll(".carousel img");

    function showImage(i) {
      imgElements.forEach(img => img.classList.remove("active"));
      imgElements[i].classList.add("active");
    }

    function prevImage() {
      index = (index - 1 + images.length) % images.length;
      showImage(index);
    }

    function nextImage() {
      index = (index + 1) % images.length;
      showImage(index);
    }
  </script>
</body>

</html>
